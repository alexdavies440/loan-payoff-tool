<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Interest Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>

<body>
    <h2>Savings Interest Tool</h2>
    <form action="">
        <label for="balance">Balance</label>
        <input type="number" name="balance" value="1000">

        <label for="rate">Rate</label>
        <input type="number" name="rate" value="3" step=".01">

        <label for="contribution">Monthly Contribution</label>
        <input type="number" name="contribution" value="100">

        <label for="withdrawal">Withdrawal</label>
        <input type="number" name="withdrawal" value="0">

        <label for="months">Months</label>
        <input type="number" name="months" value="12">

        <button>Calculate</button>
    </form>

    <div>
        <p></p>
        <p id="finalBalance"></p>
    </div>


</body>

</html>
