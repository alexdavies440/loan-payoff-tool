<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Payoff Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>

<body>
    <h2>Loan Payoff Tool</h2>
    <form action="">
        <label for="balance">Balance</label>
        <input type="number" name="balance" value="10000" step=".01">

        <label for="rate">Rate</label>
        <input type="number" name="rate" value="7" step=".01">

        <label for="payment">Monthly Payment</label>
        <input type="number" name="payment" value="100" step=".01">

        <label for="months">Months</label>
        <input type="number" name="months" value="360">

        <button>Calculate</button>
    </form>

    <div>
        <p></p>
        <p id="finalBalance"></p>
    </div>


</body>

</html>
